server {
    listen 80;
    server_name _;  # Replace with your domain or EC2 public IP

    # ── React frontend ────────────────────────────────────────────────────────
    root /var/www/kaalimitti/fronted/dist;
    index index.html;

    # Handle React Router — always serve index.html for non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Node.js backend API proxy ─────────────────────────────────────────────
    location /api {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── File size for image uploads ───────────────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
